    <title>Golden Traders — Classifieds & Content Portal</title>
    <script type="module" crossorigin src="/assets/index-Ivelz_Ve.js"></script>

  </head>
  <body>
    <div id="root"></div>
    <style>
      .live-market-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
        margin: 1rem auto 0;
        max-width: 1280px;
        padding: 0 1rem;
      }

      .live-market-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 1.1rem;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(240, 245, 255, 0.82));
        padding: 1rem;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      }

      .live-market-card::before {
        content: "";
        position: absolute;
        inset: auto -20% -28% -20%;
        height: 70px;
        background: radial-gradient(circle at center, rgba(96, 165, 250, 0.2), transparent 60%);
      }

      .live-market-card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.65rem;
      }

      .live-market-card__tag {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.08);
        padding: 0.34rem 0.6rem;
        color: #1d4ed8;
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .live-market-card__trend {
        color: #0f9f6e;
        font-size: 0.7rem;
        font-weight: 800;
      }

      .live-market-card__body {
        position: relative;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: 0.9rem;
      }

      .live-market-card__body h3 {
        margin: 0;
        color: #0f172a;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .live-market-card__body strong {
        color: #0f172a;
        font-size: 1.3rem;
        font-weight: 800;
      }

      .live-market-card p {
        position: relative;
        margin: 0.9rem 0 0;
        color: #52607a;
        font-size: 0.7rem;
        line-height: 1.5;
      }

      .hero-ad-panel {
        width: min(100%, 300px);
        padding: 0.8rem;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(239, 247, 255, 0.65));
        border-radius: 1rem;
      }

      .hero-ad-carousel {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }

      .hero-ad-card {
        overflow: hidden;
        border-radius: 0.95rem;
        border: 1px solid rgba(148, 163, 184, 0.12);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.05);
      }

      .hero-ad-card__badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0.7rem 0.7rem 0;
        border-radius: 999px;
        background: rgba(79, 149, 255, 0.12);
        padding: 0.32rem 0.58rem;
        color: #1d5ac8;
        font-size: 0.56rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .hero-ad-card__image {
        display: flex;
        align-items: end;
        justify-content: flex-start;
        height: 86px;
        margin: 0.7rem;
        border-radius: 0.8rem;
        background: linear-gradient(135deg, rgba(49, 102, 203, 0.8), rgba(125, 211, 252, 0.75));
        padding: 0.7rem;
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }

      .hero-ad-card__content {
        padding: 0 0.8rem 0.8rem;
      }

      .hero-ad-card__topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .hero-ad-card__topline span {
        color: #0f172a;
        font-size: 0.76rem;
        font-weight: 700;
      }

      .hero-ad-card__topline strong {
        color: #0f172a;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .hero-ad-card__content p {
        margin: 0.45rem 0 0;
        color: #52607a;
        font-size: 0.68rem;
        line-height: 1.45;
      }

      .hero-ad-card__content button {
        margin-top: 0.7rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #111827 0%, #1d4ed8 100%);
        padding: 0.52rem 0.72rem;
        color: #fff;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .hero-overlay-label {
        display: inline-block;
        margin-bottom: 0.7rem;
        color: #475569;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (max-width: 980px) {
        .live-market-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .live-market-strip {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script>
      (function () {
        const sponsoredPosts = [
          { title: 'Luxury Apartment', price: '$2,400/mo', tag: 'Property', detail: '2 Bedroom • Downtown View • Full Setup', location: 'Downtown', image: 'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=900&q=80' },
          { title: 'Family SUV', price: '$18,500', tag: 'Vehicle', detail: 'Auto • 2022 • Inspected & Ready', location: 'Auto Hub', image: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=900&q=80' },
          { title: 'Executive Desk', price: '$690', tag: 'Furniture', detail: 'Office • Premium Finish • Delivery Included', location: 'Office Park', image: 'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80' },
        ];

        function injectHeroSponsoredPosts() {
          const shell = document.querySelector('.hero-shell');
          const copy = document.querySelector('.hero-copy');
          if (!shell || !copy) return;

          if (shell.querySelector('.hero-sponsored-column')) {
            const oldRight = shell.querySelector('.hero-overlay-right');
            if (oldRight) oldRight.style.display = 'none';
            return;
          }

          const column = document.createElement('div');
          column.className = 'hero-sponsored-column';
          column.innerHTML = '<div class="top-advertisement-grid hero-top-ads">' + sponsoredPosts.map(function (post) {
            return '<article class="top-advertisement-card">' +
              '<div class="top-advertisement-card__badge">Sponsored Post</div>' +
              '<div class="top-advertisement-card__media"><img src="' + post.image + '" alt="' + post.title + '"><span>' + post.tag + '</span></div>' +
              '<div class="top-advertisement-card__content">' +
                '<div class="top-advertisement-card__row">' +
                  '<span>' + post.title + '</span>' +
                  '<strong>' + post.price + '</strong>' +
                '</div>' +
                '<p>' + post.location + '</p>' +
                '<small>' + post.detail + '</small>' +
              '</div>' +
            '</article>';
          }).join('') + '</div>';

          const row = column.querySelector('.hero-top-ads');
          if (row) {
            row.style.display = 'flex';
            row.style.flexDirection = 'row';
            row.style.alignItems = 'stretch';
            row.style.gap = '0.7rem';
            row.style.width = 'min(100%, 420px)';
            row.style.maxWidth = '420px';
            row.style.overflowX = 'auto';
            row.style.overflowY = 'visible';
            row.style.flexWrap = 'nowrap';
            row.style.scrollbarWidth = 'none';
            row.style.msOverflowStyle = 'none';
            row.style.webkitOverflowScrolling = 'touch';
          }

          column.querySelectorAll('.top-advertisement-card').forEach(function (card) {
            card.style.flex = '0 0 220px';
            card.style.minWidth = '220px';
            card.style.maxWidth = '220px';
          });

          copy.parentNode.insertBefore(column, copy.nextSibling);

          const rowAfterInsert = shell.querySelector('.hero-top-ads');
          if (rowAfterInsert) {
            rowAfterInsert.style.display = 'flex';
            rowAfterInsert.style.flexDirection = 'row';
            rowAfterInsert.style.alignItems = 'stretch';
            rowAfterInsert.style.gap = '0.7rem';
            rowAfterInsert.style.width = 'min(100%, 420px)';
            rowAfterInsert.style.maxWidth = '420px';
            rowAfterInsert.style.overflowX = 'auto';
            rowAfterInsert.style.overflowY = 'visible';
            rowAfterInsert.style.flexWrap = 'nowrap';
            rowAfterInsert.style.scrollbarWidth = 'none';
            rowAfterInsert.style.msOverflowStyle = 'none';
            rowAfterInsert.style.webkitOverflowScrolling = 'touch';
            rowAfterInsert.querySelectorAll('.top-advertisement-card').forEach(function (card) {
              card.style.flex = '0 0 220px';
              card.style.minWidth = '220px';
              card.style.maxWidth = '220px';
            });
          }

          const oldRight = shell.querySelector('.hero-overlay-right');
          if (oldRight) oldRight.style.display = 'none';
        }

        const styles = document.createElement('style');
        styles.textContent = '.hero-sponsored-column{display:flex;align-items:center;justify-content:center;width:100%;min-width:0}.hero-top-ads{display:flex;flex-direction:row;align-items:stretch;gap:.7rem;width:min(100%, 420px);max-width:420px;overflow-x:auto;overflow-y:visible;flex-wrap:nowrap;scrollbar-width:none}.hero-top-ads::-webkit-scrollbar{display:none}.hero-top-ads .top-advertisement-card{flex:0 0 220px;min-width:220px;max-width:220px;overflow:hidden;border:1px solid rgba(148,163,184,.14);border-radius:1rem;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(239,247,255,.75));box-shadow:0 12px 28px rgba(15,23,42,.05)}.top-advertisement-card__badge{display:inline-flex;align-items:center;justify-content:center;margin:.8rem .8rem 0;padding:.3rem .55rem;border-radius:999px;background:rgba(59,130,246,.1);color:#1d4ed8;font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.top-advertisement-card__media{position:relative;display:block;height:82px;margin:.7rem .8rem 0;overflow:hidden;border-radius:.75rem;background:linear-gradient(135deg,rgba(12,74,110,.75),rgba(96,165,250,.72))}.top-advertisement-card__media img{display:block;width:100%;height:100%;object-fit:cover}.top-advertisement-card__media span{position:absolute;left:.7rem;bottom:.7rem;z-index:1;display:inline-flex;align-items:center;border-radius:999px;background:rgba(15,23,42,.45);padding:.28rem .5rem;color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(4px)}.top-advertisement-card__content{padding:.8rem}.top-advertisement-card__row{display:flex;align-items:center;justify-content:space-between;gap:.7rem}.top-advertisement-card__row span{color:#0f172a;font-size:.8rem;font-weight:700}.top-advertisement-card__row strong{color:#0f172a;font-size:.82rem;font-weight:800}.top-advertisement-card__content p{margin:.55rem 0 0;color:#194878;font-size:.72rem;font-weight:600}.top-advertisement-card__content small{display:block;margin-top:.4rem;color:#52607a;font-size:.68rem;line-height:1.5}@media (max-width: 1023px){.hero-top-ads{flex-wrap:nowrap}.hero-top-ads .top-advertisement-card{min-width:220px;max-width:220px}}@media (max-width: 767px){.hero-top-ads{flex-wrap:nowrap}.hero-top-ads .top-advertisement-card{min-width:220px;max-width:220px}}';
        document.head.appendChild(styles);

        function initHeroAdScroll() {
          const row = document.querySelector('.hero-top-ads');
          if (!row) return;

          const cards = row.querySelectorAll('.top-advertisement-card');
          if (cards.length < 2) return;

          let scrollAmount = 0;
          const cardWidth = cards[0].getBoundingClientRect().width + 14;

          row.addEventListener('mouseenter', function () {
            row.dataset.paused = 'true';
          });

          row.addEventListener('mouseleave', function () {
            row.dataset.paused = 'false';
          });

          setInterval(function () {
            if (row.dataset.paused === 'true') return;

            const maxScroll = row.scrollWidth - row.clientWidth;
            if (maxScroll <= 0) return;

            scrollAmount += cardWidth;
            if (scrollAmount >= maxScroll) {
              scrollAmount = 0;
            }

            row.scrollTo({ left: scrollAmount, behavior: 'smooth' });
          }, 2600);
        }

        window.addEventListener('load', function () {
          setTimeout(function () {
            injectHeroSponsoredPosts();
            initHeroAdScroll();
          }, 200);
        });

        setTimeout(function () {
          injectHeroSponsoredPosts();
          initHeroAdScroll();
        }, 500);
      })();
    </script>
  </body>
</html>
